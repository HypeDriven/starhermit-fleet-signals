<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1626">
  <title>Fleet Signals</title>
  <meta name="description" content="Fleet Signals — hidden-information fleet strategy over a holographic chart table.">
  <link rel="stylesheet" href="./src/ui/styles.css">
  <link rel="apple-touch-icon" href="./icon.png">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <!-- Three.js canvas fills the game region but is never the only UI. -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <!-- Projected DOM label layer (aligned with 3D targets each frame). -->
  <div id="label-layer" aria-hidden="true"></div>
  <!-- Semantic HTML interface layer. -->
  <div id="ui"></div>
  <!-- Accessibility live regions -->
  <div id="live-polite" class="sr-only" role="status" aria-live="polite"></div>
  <div id="live-assertive" class="sr-only" role="alert" aria-live="assertive"></div>
  <div id="caption-line" class="sr-only" aria-live="polite"></div>
  <noscript>
    <div style="padding:2rem;font-family:sans-serif;color:#fff;background:#0a1626;min-height:100vh">
      <h1>Fleet Signals</h1>
      <p>Fleet Signals requires JavaScript. Enable JavaScript and reload to take command of your fleet.</p>
    </div>
  </noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
