<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fleet Signals — smoke test</title>
  <link rel="stylesheet" href="../src/ui/styles.css">
  <script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="label-layer"></div>
  <div id="ui"></div>
  <div id="live-polite" class="sr-only" role="status" aria-live="polite"></div>
  <div id="live-assertive" class="sr-only" role="alert" aria-live="assertive"></div>
  <div id="caption-line" class="sr-only" aria-live="polite"></div>
  <script type="module">
    const log = (m) => console.log('[smoke] ' + m);
    const fail = (m) => { console.error('[smoke-FAIL] ' + m); };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    async function waitFor(fn, what, timeout = 30000) {
      const t0 = Date.now();
      while (!fn()) {
        if (Date.now() - t0 > timeout) throw new Error('timeout waiting for ' + what);
        await sleep(80);
      }
    }
    window.addEventListener('error', (e) => fail('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', (e) => fail('unhandled rejection: ' + (e.reason?.message || e.reason)));

    try {
      localStorage.clear();
      await import('../src/main.js');
      const { app } = window.__fleet;
      const E = await import('../src/rules/engine.js');

      app.doc.settings.reducedMotion = true; // fast, deterministic-ish flow
      app.applySettings();

      await waitFor(() => document.querySelector('.game-title'), 'title screen');
      log('title rendered');

      // Practice: setup -> launch -> auto-place -> confirm -> full battle
      app.showSetup('practice');
      await sleep(50);
      document.querySelector('[data-act="launch"]').click();
      await waitFor(() => app.session && app.phase === 'placement', 'placement phase');
      log('placement phase reached');
      app._autoPlace();
      app._confirmPlacement();
      await waitFor(() => app.session.state.phase === 'battle', 'battle phase');
      log('battle phase reached');

      let shots = 0;
      while (app.session.state.phase !== 'finished') {
        await waitFor(() => !app.inputLocked || app.session.state.phase === 'finished', 'input unlocked');
        if (app.session.state.phase === 'finished') break;
        const st = app.session.state;
        if (app.session.needsAI()) { await sleep(150); continue; }
        const cur = st.players[st.currentPlayerIndex];
        if (cur.id !== 'you') { await sleep(150); continue; }
        const fire = E.listLegalActions(st, 'you').find((a) => a.type === 'fire');
        if (!fire) break;
        const cell = fire.cells[0];
        app.selectedCell = cell;
        app._fire(cell);
        shots++;
        if (shots > 200) throw new Error('battle did not terminate');
        await sleep(30);
      }
      log('battle finished after ' + shots + ' player shots; winner=' + app.session.state.winner);
      await waitFor(() => document.querySelector('.result-headline'), 'results overlay');
      log('results overlay shown: ' + document.querySelector('.result-headline').textContent);
      if (!document.querySelector('.score-rows tr.total')) throw new Error('no score breakdown');
      log('score breakdown present, total=' + document.querySelector('.score-rows tr.total td:last-child').textContent);

      // Back to title, then a journey stage setup screen
      document.querySelector('[data-act="title"]').click();
      await waitFor(() => document.querySelector('.game-title'), 'title after results');
      app.showJourney();
      await sleep(50);
      const firstStage = document.querySelector('[data-stage="j01"]');
      if (!firstStage) throw new Error('journey map missing stage j01');
      firstStage.click();
      await waitFor(() => document.querySelector('[data-act="launch"]'), 'journey setup');
      log('journey setup OK');

      // Learn mode lesson 1
      app.showTitle(); await sleep(30);
      app.showLearn(); await sleep(30);
      document.querySelector('[data-lesson="deploy"]').click();
      await waitFor(() => app.session && app.phase === 'placement', 'lesson placement');
      app._autoPlace();
      app._confirmPlacement();
      await waitFor(() => app.session.state.phase === 'battle', 'lesson battle');
      log('lesson 1 ran (placement objective)');

      // Hosted lobby: hot-seat two players through placement handover
      app.showTitle(); await sleep(30);
      app.showLobby(); await sleep(30);
      document.querySelectorAll('[data-seat-ready]').forEach((b) => b.click());
      await sleep(30);
      document.querySelector('[data-act="start"]').click();
      await waitFor(() => app.session && app.phase === 'placement', 'hosted placement');
      log('hosted lobby started');
      app._autoPlace();
      app._confirmPlacement();
      await waitFor(() => document.querySelector('.overlay'), 'handover overlay');
      log('handover overlay shown (privacy)');
      document.querySelector('[data-act="ready"]').click();
      await sleep(100);
      app._autoPlace();
      app._confirmPlacement();
      await waitFor(() => app.session.state.phase === 'battle', 'hosted battle');
      log('hosted battle reached');

      // Save persistence: settings + stats survive a reload path
      const saved = JSON.parse(localStorage.getItem('fleet-signals-save'));
      if (!saved || saved.stats.sessions < 1) throw new Error('save not persisted');
      log('save persisted with sessions=' + saved.stats.sessions);

      console.log('[smoke] ALL OK');
    } catch (err) {
      try {
        const app = window.__fleet?.app;
        console.error('[smoke-diag] ' + JSON.stringify({
          phase: app?.phase, inputLocked: app?.inputLocked, paused: app?.paused,
          statePhase: app?.session?.state?.phase,
          current: app?.session?.state?.players?.[app.session.state.currentPlayerIndex]?.id,
          needsAI: app?.session?.needsAI?.(), hidden: document.hidden,
          overlay: !!document.querySelector('.overlay'),
        }));
      } catch { /* ignore */ }
      console.error('[smoke-FAIL] ' + err.message + '\n' + (err.stack || ''));
    }
  </script>
</body>
</html>
